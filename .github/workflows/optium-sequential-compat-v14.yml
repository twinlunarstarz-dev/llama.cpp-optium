name: Optium sequential compatibility v14

on:
  pull_request:
    branches: [master]
    paths:
      - .github/OPTIUM_COMPAT_V14

permissions:
  contents: write

concurrency:
  group: optium-sequential-compat-v14
  cancel-in-progress: true

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/cuda-sequential-integration-2026-08-22

      - name: Preserve current-upstream backend capability ABI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "llama.cpp-optium integration"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ggml/include/ggml-backend.h')
          s = p.read_text()
          if 'bool mmap_support;' not in s:
              old = '''        // event synchronization\n        bool events;\n'''
              new = '''        // event synchronization\n        bool events;\n        // mmap is supported for loading\n        bool mmap_support;\n'''
              if old not in s:
                  raise SystemExit('backend capability insertion point not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          git diff --check
          git add ggml/include/ggml-backend.h
          if ! git diff --cached --quiet; then
            git commit -m 'ggml: preserve upstream mmap backend capability in sequential integration'
            git push origin HEAD:opt/cuda-sequential-integration-2026-08-22
          fi

      - name: CPU validation
        shell: bash
        run: |
          set +e
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON >/tmp/configure.log 2>&1
          c=$?; echo $c >/tmp/configure.rc
          if [ $c -eq 0 ]; then cmake --build build -j2 >/tmp/build.log 2>&1; b=$?; else : >/tmp/build.log; b=99; fi
          echo $b >/tmp/build.rc
          if [ $b -eq 0 ]; then ctest --test-dir build --output-on-failure -R 'test-(arg-parser|llama-archs|sequential)' >/tmp/test.log 2>&1; t=$?; else : >/tmp/test.log; t=99; fi
          echo $t >/tmp/test.rc
          exit 0

      - name: Publish validation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Sequential compatibility validation'; echo
            echo '- driver: v14'
            echo "- configure rc: $(cat /tmp/configure.rc)"
            echo "- build rc: $(cat /tmp/build.rc)"
            echo "- focused tests rc: $(cat /tmp/test.rc)"
            if [ "$(cat /tmp/configure.rc)" != 0 ]; then
              echo; echo '## Configure'; echo '```text'; tail -n 300 /tmp/configure.log; echo '```'
            elif [ "$(cat /tmp/build.rc)" != 0 ]; then
              echo; echo '## Build'; echo '```text'; tail -n 800 /tmp/build.log; echo '```'
            elif [ "$(cat /tmp/test.rc)" != 0 ]; then
              echo; echo '## Tests'; echo '```text'; tail -n 800 /tmp/test.log; echo '```'
            else
              echo; echo 'CPU configure/build and focused tests passed.'
            fi
          } > integration/VALIDATION.md
          git add integration/VALIDATION.md
          git commit -m 'test: record sequential compatibility validation v14'
          git push origin HEAD:opt/cuda-sequential-integration-2026-08-22
