name: Optium sequential NO_ALLOC compatibility v13

on:
  pull_request:
    branches: [master]
    paths:
      - .github/OPTIUM_SEQUENTIAL_NOALLOC_V13

permissions:
  contents: write

concurrency:
  group: optium-sequential-port-integration
  cancel-in-progress: true

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/cuda-sequential-integration-2026-08-22

      - name: Port externally-managed tensor allocation contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "llama.cpp-optium integration"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          h = Path('ggml/include/ggml.h')
          s = h.read_text()
          old = '''        GGML_TENSOR_FLAG_COMPUTE = 16, // ...must be computed\n'''
          new = '''        GGML_TENSOR_FLAG_COMPUTE  = 16, // ...must be computed\n        GGML_TENSOR_FLAG_NO_ALLOC = 32, // ...has payload storage managed outside of the graph allocator\n'''
          if 'GGML_TENSOR_FLAG_NO_ALLOC' not in s:
              if old not in s:
                  raise SystemExit('tensor flag insertion point not found')
              s = s.replace(old, new, 1)
              h.write_text(s)

          p = Path('ggml/src/ggml-alloc.c')
          s = p.read_text()
          helper = '''\nstatic bool ggml_gallocr_is_no_alloc(const struct ggml_tensor * tensor) {\n    return tensor->flags & GGML_TENSOR_FLAG_NO_ALLOC;\n}\n'''
          anchor = '''static bool ggml_gallocr_is_allocated(ggml_gallocr_t galloc, struct ggml_tensor * t) {\n    return t->data != NULL // tensor data already set externally\n        || t->buffer // tensor on external buffer (but not yet allocated)\n        || ggml_gallocr_is_own(galloc, t); // tensor will be allocated by galloc\n}\n'''
          if 'ggml_gallocr_is_no_alloc' not in s:
              if anchor not in s:
                  raise SystemExit('allocator helper insertion point not found')
              s = s.replace(anchor, anchor + helper, 1)

          allocate_anchor = '''static void ggml_gallocr_allocate_node(ggml_gallocr_t galloc, struct ggml_tensor * node, int buffer_id) {\n    GGML_ASSERT(buffer_id >= 0);\n'''
          allocate_new = '''static void ggml_gallocr_allocate_node(ggml_gallocr_t galloc, struct ggml_tensor * node, int buffer_id) {\n    GGML_ASSERT(buffer_id >= 0);\n\n    // Sequential/transient tensors are attached to bounded external storage immediately\n    // before execution and must not reserve space from the graph allocator.\n    if (ggml_gallocr_is_no_alloc(node)) {\n        return;\n    }\n'''
          if 'Sequential/transient tensors are attached' not in s:
              if allocate_anchor not in s:
                  raise SystemExit('allocator node insertion point not found')
              s = s.replace(allocate_anchor, allocate_new, 1)
          p.write_text(s)
          PY
          git diff --check
          git add ggml/include/ggml.h ggml/src/ggml-alloc.c
          git commit -m 'ggml: restore external tensor allocation contract for sequential mode'
          git push origin HEAD:opt/cuda-sequential-integration-2026-08-22

      - name: CPU validation
        shell: bash
        run: |
          set +e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON >/tmp/configure.log 2>&1
          c=$?; echo $c >/tmp/configure.rc
          if [ $c -eq 0 ]; then cmake --build build -j2 >/tmp/build.log 2>&1; b=$?; else : >/tmp/build.log; b=99; fi
          echo $b >/tmp/build.rc
          if [ $b -eq 0 ]; then ctest --test-dir build --output-on-failure -R 'test-(arg-parser|llama-archs|sequential)' >/tmp/test.log 2>&1; t=$?; else : >/tmp/test.log; t=99; fi
          echo $t >/tmp/test.rc
          exit 0

      - name: Publish validation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Sequential NO_ALLOC compatibility validation'; echo
            echo '- driver: v13'
            echo "- configure rc: $(cat /tmp/configure.rc)"
            echo "- build rc: $(cat /tmp/build.rc)"
            echo "- focused tests rc: $(cat /tmp/test.rc)"
            if [ "$(cat /tmp/configure.rc)" != 0 ]; then
              echo; echo '## Configure'; echo '```text'; tail -n 300 /tmp/configure.log; echo '```'
            elif [ "$(cat /tmp/build.rc)" != 0 ]; then
              echo; echo '## Build'; echo '```text'; tail -n 700 /tmp/build.log; echo '```'
            elif [ "$(cat /tmp/test.rc)" != 0 ]; then
              echo; echo '## Tests'; echo '```text'; tail -n 700 /tmp/test.log; echo '```'
            else
              echo; echo 'CPU configure/build and focused tests passed.'
            fi
          } > integration/VALIDATION.md
          git add integration/VALIDATION.md
          git commit -m 'test: record sequential NO_ALLOC compatibility validation'
          git push origin HEAD:opt/cuda-sequential-integration-2026-08-22
