name: Differentiable Llama training

on:
  push:
    branches: [testing]
    paths:
      - '.github/workflows/training-no-cache-prototype.yml'
      - 'examples/training/**'
      - 'src/llama-context.cpp'
      - 'src/llama-graph.h'
      - 'src/models/llama.cpp'

permissions:
  contents: read

jobs:
  no-cache-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production training and inference binaries
        run: |
          cmake -S . -B build -DGGML_CUDA=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-finetune llama-cli -j 2
      - name: Download pinned test model
        run: |
          curl --fail --location --retry 3 --max-time 180 https://huggingface.co/ggml-org/tiny-llamas/resolve/6e091d8/stories260K.gguf --output tiny.gguf
          echo '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  tiny.gguf' | sha256sum --check
      - name: Train, export, and reload the actual tiny GGUF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('tiny-train.txt').write_text(('Once upon a time there was a small dragon who learned to read.\n' * 128), encoding='utf-8')
          PY
          timeout 240 ./build/bin/llama-finetune --model tiny.gguf --file tiny-train.txt --output finetuned-model.gguf -c 64 -b 64 -ub 64 --epochs 1
          test -s finetuned-model.gguf
          python3 - <<'PY'
          from pathlib import Path
          data = Path('finetuned-model.gguf').read_bytes()
          assert data[:4] == b'GGUF'
          print('EXPORTED_GGUF_BYTES', len(data))
          PY
          timeout 60 ./build/bin/llama-cli -m finetuned-model.gguf -p 'Once upon a time' -n 4 --no-warmup --single-turn --simple-io > reload.log 2>&1 || { cat reload.log; exit 1; }
          tail -n 20 reload.log
