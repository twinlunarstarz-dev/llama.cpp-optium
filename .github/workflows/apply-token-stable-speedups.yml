name: Apply token-stable speedups

on:
  push:
    branches:
      - perf/token-stable-server-speedups

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/token-stable-server-speedups
          fetch-depth: 0

      - name: Apply guarded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # CUDA graphs replay the same kernels/arguments and remove repeated launch setup.
          # Preserve explicit user overrides while making the optimized path the default.
          replace_once(
              "ggml/CMakeLists.txt",
              """if (NOT GGML_CUDA_GRAPHS_DEFAULT)\n    set(GGML_CUDA_GRAPHS_DEFAULT OFF)\nendif()\n""",
              """if (NOT DEFINED GGML_CUDA_GRAPHS_DEFAULT)\n    # CUDA graph replay preserves the same kernel sequence while reducing launch overhead.\n    # Explicit GGML_CUDA_GRAPHS / GGML_CUDA_GRAPHS_DEFAULT overrides remain authoritative.\n    set(GGML_CUDA_GRAPHS_DEFAULT ON)\nendif()\n""",
          )

          # Make dependencies explicit for the allocation-free/dense scratch fast paths below.
          replace_once(
              "src/llama-kv-cache.cpp",
              """#include <algorithm>\n#include <cassert>\n#include <cmath>\n#include <cstring>\n""",
              """#include <algorithm>\n#include <array>\n#include <bitset>\n#include <cassert>\n#include <cmath>\n#include <cstring>\n""",
          )

          # Multi-request token generation normally has one token per sequence. In that case
          # the existing per-sequence unordered_maps and change-index vectors can never be
          # reused, so skip constructing them and emit the exact same mask directly.
          marker = """    for (uint32_t s = 0; s < n_stream; ++s) {\n        // bookkeeping of the KQ mask cells that could change for other tokens of the same sequence\n        std::unordered_map<llama_seq_id, uint32_t>              seq_srct;\n        std::unordered_map<llama_seq_id, std::vector<uint32_t>> seq_idxs;\n"""
          fast_path = """    // Decode fast path: when every token belongs to one distinct sequence, there is\n    // no later token for which the per-sequence mask-copy cache can be reused. Avoid the\n    // unordered_map/vector setup entirely while writing byte-for-byte the same mask values.\n    bool unique_single_seq = ubatch->n_tokens == ubatch->n_seqs_unq;\n    if (unique_single_seq) {\n        std::bitset<LLAMA_MAX_SEQ> seen;\n        for (uint32_t i = 0; i < ubatch->n_tokens; ++i) {\n            if (ubatch->n_seq_id[i] != 1) {\n                unique_single_seq = false;\n                break;\n            }\n            const llama_seq_id seq_id = ubatch->seq_id[i][0];\n            GGML_ASSERT(seq_id >= 0 && seq_id < LLAMA_MAX_SEQ);\n            if (seen.test(seq_id)) {\n                unique_single_seq = false;\n                break;\n            }\n            seen.set(seq_id);\n        }\n    }\n\n    if (unique_single_seq) {\n        for (uint32_t s = 0; s < n_stream; ++s) {\n            for (uint32_t ii = 0; ii < n_tps; ++ii) {\n                const uint32_t i = s*n_tps + ii;\n                const llama_seq_id seq_id = ubatch->seq_id[i][0];\n                const auto & cells = v_cells.at(seq_to_stream[seq_id]);\n\n                      llama_pos p0 = -1;\n                const llama_pos p1 = ubatch->pos[i];\n                const llama_pos p1_x = is_2d ? ubatch->pos[i + ubatch->n_tokens*2] : 0;\n                const llama_pos p1_y = is_2d ? ubatch->pos[i + ubatch->n_tokens]   : 0;\n                const uint64_t idst = n_kv*i;\n\n                for (uint32_t j = 0; j < n_kv; ++j) {\n                    if (cells.is_empty(j)) {\n                        goto skip_unique;\n                    }\n                    if (!cells.seq_has(j, seq_id)) {\n                        goto skip_unique;\n                    }\n\n                    p0 = cells.pos_get(j);\n\n                    if (causal) {\n                        if (p0 > p1) {\n                            goto skip_unique;\n                        }\n                        if (is_2d && p0 == p1) {\n                            const auto & p0_ext = cells.ext_get(j);\n                            if (p0_ext.is_2d_gt(p1_x, p1_y)) {\n                                goto skip_unique;\n                            }\n                        }\n                    }\n\n                    if (swa && llama_hparams::is_masked_swa(n_swa, swa_type, p0, p1)) {\n                        goto skip_unique;\n                    }\n\n                    if (alibi) {\n                        data[idst + j] = llama_cast<T>(static_cast<float>(-std::abs(p0 - p1)));\n                    } else {\n                        data[idst + j] = mask_keep;\n                    }\n                    continue;\n\nskip_unique:\n                    data[idst + j] = mask_drop;\n                }\n            }\n        }\n        return;\n    }\n\n    for (uint32_t s = 0; s < n_stream; ++s) {\n        // bookkeeping of the KQ mask cells that could change for other tokens of the same sequence\n        std::unordered_map<llama_seq_id, uint32_t>              seq_srct;\n        std::unordered_map<llama_seq_id, std::vector<uint32_t>> seq_idxs;\n        seq_srct.reserve(ubatch->n_seqs_unq);\n        seq_idxs.reserve(ubatch->n_seqs_unq);\n"""
          replace_once("src/llama-kv-cache.cpp", marker, fast_path)

          # Avoid allocator churn in KV batch preparation. This only reserves capacity; element
          # order, slot choice, cache contents and graph inputs are unchanged.
          replace_once(
              "src/llama-kv-cache.cpp",
              """        std::vector<llama_ubatch> ubatches;\n        while (true) {\n""",
              """        std::vector<llama_ubatch> ubatches;\n        ubatches.reserve((balloc.get_n_tokens() + n_ubatch - 1) / n_ubatch);\n        while (true) {\n""",
          )
          replace_once(
              "src/llama-kv-cache.cpp",
              """    // remember the old state of the cells so we can restore it in the end\n    std::vector<state_t> states;\n\n    bool success = true;\n""",
              """    // remember the old state of the cells so we can restore it in the end\n    std::vector<state_t> states;\n    res.reserve(ubatches.size());\n    states.reserve(ubatches.size());\n\n    bool success = true;\n""",
          )
          replace_once(
              "src/llama-kv-cache.cpp",
              """            state_t state = { sinfo_new, v_heads, {} };\n\n            for (uint32_t s = 0; s < sinfo_new.n_stream(); ++s) {\n""",
              """            state_t state = { sinfo_new, v_heads, {} };\n            state.v_cells.reserve(sinfo_new.n_stream());\n\n            for (uint32_t s = 0; s < sinfo_new.n_stream(); ++s) {\n""",
          )

          # ngram-mod asks for a very small predecessor window on every generation step. Use a
          # compact dense scratch table for the normal narrow-window case and retain the exact
          # unordered_map implementation as a bounded-memory fallback for unusual wide batches.
          old_prev = r'''void llama_kv_cache::get_prev_tokens(const llama_ubatch & ubatch, uint32_t n, std::vector<llama_token> & res) const {
    const uint32_t n_tokens = ubatch.n_tokens;

    res.clear();
    res.resize(n_tokens*n, LLAMA_TOKEN_NULL);

    if (n == 0) {
        return;
    }

    // note: apply_ubatch() has already stored the current ubatch
    //       the window below thus covers tokens of this very ubatch as well, which is what we want
    llama_pos p_min = std::numeric_limits<llama_pos>::max();
    llama_pos p_max = std::numeric_limits<llama_pos>::min();

    std::bitset<LLAMA_MAX_SEQ> seqs;

    for (uint32_t i = 0; i < n_tokens; ++i) {
        p_min = std::min(p_min, ubatch.pos[i]);
        p_max = std::max(p_max, ubatch.pos[i]);
    }

    for (uint32_t s = 0; s < ubatch.n_seqs_unq; ++s) {
        seqs.set(ubatch.seq_id_unq[s]);
    }

    // (seq_id, pos) -> token, for every cell that could be a predecessor of a ubatch token
    std::unordered_map<uint64_t, llama_token> hist;

    const auto key = [](llama_seq_id seq_id, llama_pos pos) {
        return ((uint64_t) seq_id << 32) | (uint32_t) pos;
    };

    for (uint32_t s = 0; s < n_stream; ++s) {
        v_cells[s].for_each_token_in(seqs, p_min - (llama_pos) n, p_max,
            [&](llama_seq_id seq_id, llama_pos pos, llama_token tok) {
                hist[key(seq_id, pos)] = tok;
            });
    }

    for (uint32_t i = 0; i < n_tokens; ++i) {
        // TODO: a token that belongs to more than one sequence has an ambiguous history.
        //       the n-gram architectures have to reject such batches
        const llama_seq_id seq_id = ubatch.seq_id[i][0];

        for (uint32_t j = 0; j < n; ++j) {
            const llama_pos p = ubatch.pos[i] - (llama_pos) (n - j);
            if (p < 0) {
                continue;
            }

            const auto it = hist.find(key(seq_id, p));
            if (it != hist.end()) {
                res[i*n + j] = it->second;
            }
        }
    }
}
'''
          new_prev = r'''void llama_kv_cache::get_prev_tokens(const llama_ubatch & ubatch, uint32_t n, std::vector<llama_token> & res) const {
    const uint32_t n_tokens = ubatch.n_tokens;

    res.clear();
    res.resize(n_tokens*n, LLAMA_TOKEN_NULL);

    if (n == 0) {
        return;
    }

    // note: apply_ubatch() has already stored the current ubatch
    //       the window below thus covers tokens of this very ubatch as well, which is what we want
    llama_pos p_min = std::numeric_limits<llama_pos>::max();
    llama_pos p_max = std::numeric_limits<llama_pos>::min();

    std::bitset<LLAMA_MAX_SEQ> seqs;

    for (uint32_t i = 0; i < n_tokens; ++i) {
        p_min = std::min(p_min, ubatch.pos[i]);
        p_max = std::max(p_max, ubatch.pos[i]);
    }

    for (uint32_t s = 0; s < ubatch.n_seqs_unq; ++s) {
        seqs.set(ubatch.seq_id_unq[s]);
    }

    const llama_pos hist_p0 = std::max<llama_pos>(0, p_min - (llama_pos) n);
    const uint64_t hist_span = (uint64_t) (p_max - hist_p0) + 1;
    constexpr uint64_t DENSE_HIST_MAX_ENTRIES = 1u << 20; // 4 MiB with 32-bit token ids

    // Normal generation/ngram path: positions are close together, so direct indexing avoids
    // hashing and per-entry allocation while preserving the same last-write-wins semantics.
    if (ubatch.n_seqs_unq > 0 && hist_span <= DENSE_HIST_MAX_ENTRIES / ubatch.n_seqs_unq) {
        std::array<int32_t, LLAMA_MAX_SEQ> seq_to_local;
        seq_to_local.fill(-1);

        for (uint32_t s = 0; s < ubatch.n_seqs_unq; ++s) {
            const llama_seq_id seq_id = ubatch.seq_id_unq[s];
            GGML_ASSERT(seq_id >= 0 && seq_id < LLAMA_MAX_SEQ);
            seq_to_local[seq_id] = (int32_t) s;
        }

        const size_t n_hist = (size_t) hist_span * ubatch.n_seqs_unq;
        std::vector<llama_token> hist(n_hist, LLAMA_TOKEN_NULL);

        for (uint32_t s = 0; s < n_stream; ++s) {
            v_cells[s].for_each_token_in(seqs, hist_p0, p_max,
                [&](llama_seq_id seq_id, llama_pos pos, llama_token tok) {
                    const int32_t local = seq_to_local[seq_id];
                    GGML_ASSERT(local >= 0);
                    const uint64_t pos_off = (uint64_t) (pos - hist_p0);
                    GGML_ASSERT(pos_off < hist_span);
                    hist[(size_t) local * hist_span + pos_off] = tok;
                });
        }

        for (uint32_t i = 0; i < n_tokens; ++i) {
            // TODO: a token that belongs to more than one sequence has an ambiguous history.
            //       the n-gram architectures have to reject such batches
            const llama_seq_id seq_id = ubatch.seq_id[i][0];
            const int32_t local = seq_to_local[seq_id];
            GGML_ASSERT(local >= 0);

            for (uint32_t j = 0; j < n; ++j) {
                const llama_pos p = ubatch.pos[i] - (llama_pos) (n - j);
                if (p < hist_p0 || p > p_max) {
                    continue;
                }
                res[i*n + j] = hist[(size_t) local * hist_span + (uint64_t) (p - hist_p0)];
            }
        }
        return;
    }

    // Wide/irregular batches: retain the previous sparse representation to keep memory bounded.
    std::unordered_map<uint64_t, llama_token> hist;
    const auto key = [](llama_seq_id seq_id, llama_pos pos) {
        return ((uint64_t) seq_id << 32) | (uint32_t) pos;
    };

    for (uint32_t s = 0; s < n_stream; ++s) {
        v_cells[s].for_each_token_in(seqs, p_min - (llama_pos) n, p_max,
            [&](llama_seq_id seq_id, llama_pos pos, llama_token tok) {
                hist[key(seq_id, pos)] = tok;
            });
    }

    for (uint32_t i = 0; i < n_tokens; ++i) {
        const llama_seq_id seq_id = ubatch.seq_id[i][0];
        for (uint32_t j = 0; j < n; ++j) {
            const llama_pos p = ubatch.pos[i] - (llama_pos) (n - j);
            if (p < 0) {
                continue;
            }
            const auto it = hist.find(key(seq_id, p));
            if (it != hist.end()) {
                res[i*n + j] = it->second;
            }
        }
    }
}
'''
          replace_once("src/llama-kv-cache.cpp", old_prev, new_prev)
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Configure CPU verification build
        run: >-
          cmake -S . -B build-token-stable-check
          -DGGML_CUDA=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build server and focused tests
        run: |
          cmake --build build-token-stable-check --parallel 2 --target llama-server test-sampling test-batch-alloc

      - name: Run focused tests
        run: |
          ctest --test-dir build-token-stable-check --output-on-failure -R '^(test-sampling|test-batch-alloc)$'

      - name: Commit verified source changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-token-stable-speedups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ggml/CMakeLists.txt src/llama-kv-cache.cpp .github/workflows/apply-token-stable-speedups.yml
          git diff --cached --check
          git commit -m "perf: reduce token-stable inference overhead"
          git push origin HEAD:perf/token-stable-server-speedups
