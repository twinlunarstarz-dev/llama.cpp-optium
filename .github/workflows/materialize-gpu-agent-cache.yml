name: materialize-gpu-agent-cache

on:
  push:
    branches:
      - perf/kv-spec-speedups
    paths:
      - .github/workflows/materialize-gpu-agent-cache.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/kv-spec-speedups
          fetch-depth: 0
      - name: Apply GPU agent cache
        run: python3 scripts/apply-gpu-agent-cache.py
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
      - name: CPU compile server
        run: |
          cmake -S . -B build-perf -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-perf --target llama-server -j2
      - name: Commit
        run: |
          git config user.name "openai-perf-bot"
          git config user.email "openai-perf-bot@users.noreply.github.com"
          git add tools/server/server-task.h tools/server/server-task.cpp tools/server/server-context.cpp
          git commit -m "perf(server): keep inactive agent KV resident on GPU"
          git push origin HEAD:perf/kv-spec-speedups
