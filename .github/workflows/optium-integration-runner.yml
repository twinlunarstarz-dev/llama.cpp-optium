name: Optium integration runner

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[internal] run optium upstream integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/cuda-sequential-integration-2026-08-22

      - name: Configure git
        run: |
          git config user.name "llama.cpp-optium CI"
          git config user.email "actions@users.noreply.github.com"
          git config core.autocrlf false

      - name: Fetch fork baseline and build semantic patch
        id: port
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin master
          BASE=86a9c79f866799eb0e7e89c03578ccfbcc5d808e
          git diff --binary --ignore-space-at-eol "$BASE"..origin/master > /tmp/fork-semantic.patch
          echo "patch_bytes=$(wc -c < /tmp/fork-semantic.patch)" >> "$GITHUB_OUTPUT"
          echo "patch_files=$(git diff --ignore-space-at-eol --name-only "$BASE"..origin/master | wc -l)" >> "$GITHUB_OUTPUT"

          if git apply --3way --index --whitespace=nowarn /tmp/fork-semantic.patch; then
            echo "apply_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "apply_ok=false" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          exit 0

      - name: Report patch conflicts
        if: steps.port.outputs.apply_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo 'Semantic three-way port found conflicts; no integration branch changes were pushed.'
            echo
            echo "Patch size: ${{ steps.port.outputs.patch_bytes }} bytes across ${{ steps.port.outputs.patch_files }} files."
            echo
            echo 'Conflicting files:'
            sed 's/^/- `/' /tmp/conflicts.txt | sed 's/$/`/'
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Stop on patch conflicts
        if: steps.port.outputs.apply_ok != 'true'
        run: exit 1

      - name: Commit semantic fork port
        if: steps.port.outputs.apply_ok == 'true'
        run: |
          git commit -m "sync: port fork functionality onto current upstream"

      - name: Configure validation build
        if: steps.port.outputs.apply_ok == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON

      - name: Build
        if: steps.port.outputs.apply_ok == 'true'
        run: cmake --build build -j2

      - name: Focused tests
        if: steps.port.outputs.apply_ok == 'true'
        run: ctest --test-dir build --output-on-failure -R 'test-(backend-sched|arg-parser|llama-archs)'

      - name: Push validated integration
        if: steps.port.outputs.apply_ok == 'true'
        run: git push origin HEAD:opt/cuda-sequential-integration-2026-08-22

      - name: Report success
        if: steps.port.outputs.apply_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          sha=$(git rev-parse HEAD)
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Semantic fork port applied, CPU validation build/tests passed, and integration branch was pushed at \`$sha\`."
