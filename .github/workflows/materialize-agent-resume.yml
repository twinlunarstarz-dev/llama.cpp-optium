name: materialize-agent-resume

on:
  push:
    branches:
      - perf/kv-spec-speedups
    paths:
      - .github/workflows/materialize-agent-resume.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/kv-spec-speedups
          fetch-depth: 0
      - name: Apply agent resume source changes
        run: python3 scripts/apply-agent-resume-optimizations.py --apply
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit source changes
        run: |
          git config user.name "openai-perf-bot"
          git config user.email "openai-perf-bot@users.noreply.github.com"
          git add tools/server/server-task.h tools/server/server-task.cpp tools/server/server-context.cpp common/speculative.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf(server): persist agent inference state across slot switches"
          git push origin HEAD:perf/kv-spec-speedups
