name: materialize-aggressive-runtime

on:
  push:
    branches:
      - perf/kv-spec-speedups
    paths:
      - .github/workflows/materialize-aggressive-runtime.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/kv-spec-speedups
          fetch-depth: 0
      - name: Apply aggressive runtime changes
        run: python3 scripts/apply-aggressive-runtime-speedups.py
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit runtime changes
        run: |
          git config user.name "openai-perf-bot"
          git config user.email "openai-perf-bot@users.noreply.github.com"
          git add ggml/src/ggml-cuda/ggml-cuda.cu src/llama-context.cpp tools/server/server-context.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf(runtime): widen GPU execution paths"
          git push origin HEAD:perf/kv-spec-speedups
