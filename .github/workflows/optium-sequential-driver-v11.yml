name: Optium sequential integration driver v11

on:
  pull_request:
    branches: [master]
    paths:
      - .github/OPTIUM_SEQUENTIAL_DRIVER_V11

permissions:
  contents: write

concurrency:
  group: optium-sequential-port-integration
  cancel-in-progress: true

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/cuda-sequential-integration-2026-08-22

      - name: Port and publish sequential source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "llama.cpp-optium integration"
          git config user.email "actions@users.noreply.github.com"
          git config core.autocrlf false
          UPSTREAM=70adb1b4cea5ee39f867792c78dc59320921eda7
          BRANCH=opt/cuda-sequential-integration-2026-08-22
          STEP=initializing
          DETAIL=''
          fail_report() {
            local rc=$?
            trap - ERR
            mkdir -p /tmp/report
            {
              echo '# Sequential port failure'; echo
              echo "- driver: v11"
              echo "- step: $STEP"
              echo "- exit code: $rc"
              [ -z "$DETAIL" ] || echo "- detail: $DETAIL"
              echo; echo '```text'
              git status --short || true
              echo; echo 'unmerged:'
              git ls-files -u || true
              echo '```'
            } >/tmp/report/REPORT.md
            git cherry-pick --abort >/dev/null 2>&1 || true
            git reset --hard "$UPSTREAM"
            mkdir -p integration
            cp /tmp/report/REPORT.md integration/REPORT.md
            git add integration/REPORT.md
            git commit -m 'integration: report sequential port failure v11'
            git push --force origin HEAD:"$BRANCH"
            exit 0
          }
          trap fail_report ERR

          STEP='reset current upstream'
          git reset --hard "$UPSTREAM"
          git clean -fdx

          STEP='storage-backed sequential loading'
          git cherry-pick -X theirs 7d9d3b14225b6a3502a1b24e5aaf8de6bde7d4e9

          STEP='DeepSeek sequential validation'
          git cherry-pick -X theirs 4012e11809111501ef9b735d8c461335f0e6b3c4

          STEP='multi-GPU sequential loading'
          set +e
          git cherry-pick -X theirs 1dabfb09614957038300beb5ab9622df82a7a2b7
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if git ls-files -u -- tests/test-backend-sched.cpp | grep -q .; then
              DETAIL='keeping current-upstream deletion of tests/test-backend-sched.cpp'
              git rm -f -- tests/test-backend-sched.cpp
            fi
            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              DETAIL="remaining unmerged: $remaining"
              false
            fi
            DETAIL='continuing multi-GPU cherry-pick'
            GIT_EDITOR=true git cherry-pick --continue
          fi

          STEP='document source port'
          DETAIL=''
          mkdir -p integration
          cat > integration/README.md <<'EOF'
          # Current-upstream sequential integration

          Base: upstream `70adb1b4cea5ee39f867792c78dc59320921eda7`.

          Ported from llama.cpp-optium:
          - storage-backed sequential loading
          - DeepSeek sequential support/validation
          - multi-GPU sequential routing and per-device weight windows

          The complete model remains storage-backed and need not fit RAM or VRAM.
          Overlapping textual hunks in the fork's sequential commits use the fork side while non-overlapping current-upstream code remains current. The obsolete upstream-deleted `tests/test-backend-sched.cpp` remains deleted.
          EOF
          rm -f integration/REPORT.md integration/VALIDATION.md
          git add -A
          git commit -m 'docs: record current-upstream sequential port'

          STEP='publish source'
          trap - ERR
          git push --force origin HEAD:"$BRANCH"

      - name: CPU validation
        shell: bash
        run: |
          set +e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON >/tmp/configure.log 2>&1
          c=$?; echo $c >/tmp/configure.rc
          if [ $c -eq 0 ]; then cmake --build build -j2 >/tmp/build.log 2>&1; b=$?; else : >/tmp/build.log; b=99; fi
          echo $b >/tmp/build.rc
          if [ $b -eq 0 ]; then ctest --test-dir build --output-on-failure -R 'test-(arg-parser|llama-archs|sequential)' >/tmp/test.log 2>&1; t=$?; else : >/tmp/test.log; t=99; fi
          echo $t >/tmp/test.rc
          exit 0

      - name: Publish validation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Sequential port validation'; echo
            echo '- driver: v11'
            echo "- configure rc: $(cat /tmp/configure.rc)"
            echo "- build rc: $(cat /tmp/build.rc)"
            echo "- focused tests rc: $(cat /tmp/test.rc)"
            if [ "$(cat /tmp/configure.rc)" != 0 ]; then
              echo; echo '## Configure'; echo '```text'; tail -n 300 /tmp/configure.log; echo '```'
            elif [ "$(cat /tmp/build.rc)" != 0 ]; then
              echo; echo '## Build'; echo '```text'; tail -n 600 /tmp/build.log; echo '```'
            elif [ "$(cat /tmp/test.rc)" != 0 ]; then
              echo; echo '## Tests'; echo '```text'; tail -n 600 /tmp/test.log; echo '```'
            else
              echo; echo 'CPU configure/build and focused tests passed.'
            fi
          } > integration/VALIDATION.md
          git add integration/VALIDATION.md
          git commit -m 'test: record sequential port validation'
          git push origin HEAD:opt/cuda-sequential-integration-2026-08-22
