name: Optium FreeToken sequential continuation

on:
  pull_request:
    branches: [master]
    paths:
      - .github/OPTIUM_FREETOKEN_CONTINUATION

permissions:
  contents: write

concurrency:
  group: optium-freetoken-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/sequential-freetoken-stack-2026-08-22

      - name: Apply final integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "llama.cpp-optium integration"
          git config user.email "actions@users.noreply.github.com"
          if [ -f integration/apply_pending.py ]; then
            python3 -m py_compile integration/apply_pending.py
            python3 integration/apply_pending.py
          fi
          if [ -f integration/apply_final.py ]; then
            python3 -m py_compile integration/apply_final.py
            python3 integration/apply_final.py
          fi
          if [ -f integration/fix_final_tests.py ]; then
            python3 -m py_compile integration/fix_final_tests.py
            python3 integration/fix_final_tests.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git add -A
            git commit -m 'test: align sequential validation with current APIs'
            git push origin HEAD:opt/sequential-freetoken-stack-2026-08-22
          fi

      - name: CPU configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_SERVER=OFF

      - name: CPU build
        shell: bash
        run: cmake --build build -j2

      - name: Focused tests
        shell: bash
        run: ctest --test-dir build --output-on-failure -R 'test-(batch-alloc|llama-archs|recurrent-state-rollback)'

  cuda-compile:
    needs: continue
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build build-essential

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: opt/sequential-freetoken-stack-2026-08-22

      - name: CUDA configure
        shell: bash
        run: |
          cmake -S . -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES='75;86;89' \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF

      - name: CUDA compile
        shell: bash
        run: cmake --build build-cuda -j2 --target llama-cli
