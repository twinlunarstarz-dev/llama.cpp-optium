name: materialize-active-kv-swap

on:
  push:
    branches:
      - perf/sequential-tiered-cache
    paths:
      - .github/workflows/materialize-active-kv-swap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sequential-tiered-cache
          fetch-depth: 0

      - name: Apply active KV residency changes
        run: python3 scripts/materialize-active-kv-swap.py

      - name: Fix materialized source
        shell: bash
        run: |
          sed -i 's/SRV_TRC(" - prompt cache RAM is reserved by active suspended state; skipping reusable entry\\n");/SRV_TRC("%s", " - prompt cache RAM is reserved by active suspended state; skipping reusable entry\\n");/' tools/server/server-task.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/server/server-context.cpp')
          s = p.read_text()
          anchor = '''                    const int id_task = task.id;\n\n                    server_slot * slot = get_available_slot(task);'''
          replacement = '''                    const int id_task = task.id;\n\n                    // Capacity admission must run before get_available_slot(), because\n                    // slot selection may restore a large cached prompt into unified KV.\n                    // Only do this when there is a logically free slot; a third request\n                    // should wait rather than evicting a resident request unnecessarily.\n                    bool has_idle_candidate = false;\n                    for (const auto & candidate : slots) {\n                        if (candidate.is_processing()) {\n                            continue;\n                        }\n                        if (task.id_slot != -1 && candidate.id != task.id_slot) {\n                            continue;\n                        }\n                        has_idle_candidate = true;\n                        break;\n                    }\n                    if (has_idle_candidate && !make_room_for_incoming(task)) {\n                        SRV_DBG("unable to reach a safe active-KV suspension boundary; defer task, id_task = %d\\n", id_task);\n                        queue_tasks.defer(std::move(task));\n                        break;\n                    }\n\n                    server_slot * slot = get_available_slot(task);'''
          if s.count(anchor) != 1:
              raise SystemExit(f'admission anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          duplicate = '''\n                    if (!make_room_for_incoming(task)) {\n                        SRV_DBG("unable to reach a safe active-KV suspension boundary; defer task, id_task = %d\\n", id_task);\n                        queue_tasks.defer(std::move(task));\n                        break;\n                    }\n'''
          if s.count(duplicate) != 1:
              raise SystemExit(f'post-selection admission block count={s.count(duplicate)}')
          s = s.replace(duplicate, '\n', 1)
          p.write_text(s)
          PY

      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
          git diff -- tools/server/server-task.h tools/server/server-task.cpp tools/server/server-context.cpp

      - name: CPU compile server
        run: |
          cmake -S . -B build-active-kv -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-active-kv --target llama-server -j2

      - name: Commit and push
        run: |
          git config user.name openai-perf-bot
          git config user.email openai-perf-bot@users.noreply.github.com
          rm -f scripts/materialize-active-kv-swap.py .github/workflows/materialize-active-kv-swap.yml
          git add tools/server/server-task.h tools/server/server-task.cpp tools/server/server-context.cpp scripts/materialize-active-kv-swap.py .github/workflows/materialize-active-kv-swap.yml
          git commit -m "perf(server): tier active KV state across RAM and disk"
          git push origin HEAD:perf/sequential-tiered-cache
