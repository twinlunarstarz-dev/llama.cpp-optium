name: Real GGUF fine-tune smoke (testing)

on:
  push:
    branches: [testing]
    paths:
      - '.github/workflows/training-model-smoke.yml'
      - 'examples/training/finetune.cpp'
      - 'src/llama-train-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instrument backward graph for precise diagnosis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ggml/src/ggml.c')
          code = path.read_text()
          needle = '''        // inplace operations are currently not supported
        GGML_ASSERT(!node->view_src || node->op == GGML_OP_CPY || node->op == GGML_OP_VIEW ||'''
          replacement = '''        // inplace operations are currently not supported
        if (node->view_src && node->op != GGML_OP_CPY && node->op != GGML_OP_VIEW &&
            node->op != GGML_OP_RESHAPE && node->op != GGML_OP_PERMUTE && node->op != GGML_OP_TRANSPOSE) {
            fprintf(stderr, "TRAIN_GRAPH_INVALID_VIEW op=%s name=%s source=%s flags=%d\\n",
                    ggml_op_name(node->op), node->name, node->view_src->name, (int) node->flags);
        }
        GGML_ASSERT(!node->view_src || node->op == GGML_OP_CPY || node->op == GGML_OP_VIEW ||'''
          if code.count(needle) != 1:
              raise RuntimeError('backward graph assertion changed; cannot instrument safely')
          path.write_text(code.replace(needle, replacement, 1))
          PY
      - name: Configure and build CPU finetune
        run: |
          cmake -S . -B build -DGGML_CUDA=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-finetune -j 2
      - name: Download pinned tiny Stories GGUF
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://huggingface.co/ggml-org/tiny-llamas/resolve/6e091d8/stories260K.gguf \
            --output tiny.gguf
          echo '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  tiny.gguf' | sha256sum --check
      - name: Run actual optimizer and save output GGUF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('tiny-train.txt').write_text(('Once upon a time there was a small dragon who learned to read.\n' * 128), encoding='utf-8')
          PY
          timeout 240 ./build/bin/llama-finetune --model tiny.gguf --file tiny-train.txt -c 64 -b 64 -ub 64 --epochs 1
          test -s finetuned-model.gguf
